version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sanjeevani-postgres
    restart: always
    environment:
      POSTGRES_USER: sanjeevani
      POSTGRES_PASSWORD: sanjeevani_secure_pass
      POSTGRES_DB: sanjeevani_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjeevani -d sanjeevani_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sanjeevani-api
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://sanjeevani:sanjeevani_secure_pass@db:5432/sanjeevani_db?schema=public"
      JWT_SECRET: "sanjeevani_jwt_hackathon_secret"
      AI_SERVICE_URL: "http://ai-service:8000"
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: sanjeevani-ai
    restart: always
    ports:
      - "8000:8000"

volumes:
  postgres_data:
